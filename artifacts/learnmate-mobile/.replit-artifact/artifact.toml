kind = "mobile"
previewPath = "/learnmate-mobile/"
title = "LearnMate AI Mobile"
version = "1.0.0"
id = "artifacts/learnmate-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/learnmate-mobile/" ]
localPort = 25282

[services.development]
run = "pnpm --filter @workspace/learnmate-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learnmate-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/learnmate-mobile", "run", "serve" ]

[services.env]
PORT = "25282"
BASE_PATH = "/learnmate-mobile/"
