      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        examDate:
          type: ["string", "null"]
          format: date
        subjects:
          type: array
          items:
            type: string
        studyHoursPerDay:
          type: integer
        goals:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, paused]
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - examDate
        - subjects
        - studyHoursPerDay
        - goals
        - status
        - taskCount
        - completedTaskCount
        - createdAt

    StudyPlanWithTasks:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        examDate:
          type: ["string", "null"]
          format: date
        subjects:
          type: array
          items:
            type: string
        studyHoursPerDay:
          type: integer
        goals:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, paused]
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/StudyTask"
      required:
        - id
        - userId
        - title
        - examDate
        - subjects
        - studyHoursPerDay
        - goals
        - status
        - taskCount
        - completedTaskCount
        - createdAt
        - tasks

    StudyPlanInput:
      type: object
      properties:
        title:
          type: string
        examDate:
          type: string
          format: date
        subjects:
          type: array
          items:
            type: string
        studyHoursPerDay:
          type: integer
        goals:
          type: string
      required:
        - title
        - subjects
        - studyHoursPerDay

    StudyPlanUpdate:
      type: object
