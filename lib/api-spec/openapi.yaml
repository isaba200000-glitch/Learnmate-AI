            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/session:
    get:
      operationId: checkAdminSession
      tags: [admin]
      summary: Verify the admin session token is valid
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionCheck"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: List payment submissions (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPayment"

  /admin/payments/{id}/approve:
    post:
      operationId: approvePayment
      tags: [admin]
      summary: Approve a payment and activate premium
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

