  /assistant/conversations/{conversationId}:
    get:
      operationId: getAssistantConversation
      tags: [assistant]
      summary: Full message history of a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
