                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/premium:
    post:
      operationId: setUserPremium
      tags: [admin]
      summary: Grant or revoke premium for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPremiumInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get owner-editable premium plan settings
      responses:
        "200":
          description: Current plan settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update premium plan settings (bKash number, price, duration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettings"
      responses:
        "200":
          description: Updated plan settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardSummary:
      type: object
      properties:
        userName:
          type: string
        xp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        coins:
          type: integer
        studyTimeToday:
          type: integer
          description: Study time in minutes today
        studyTimeWeek:
          type: integer
          description: Study time in minutes this week
        notesCount:
          type: integer
        flashcardDecksCount:
          type: integer
        quizzesCompletedCount:
          type: integer
        documentsCount:
          type: integer
        recentQuizSessions:
          type: array
          items:
            $ref: "#/components/schemas/QuizSession"
        activeStudyPlans:
          type: array
          items:
            $ref: "#/components/schemas/StudyPlan"
        todayTasks:
          type: array
          items:
            $ref: "#/components/schemas/StudyTask"
        weeklyXp:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              xp:
                type: integer
            required:
              - day
              - xp
      required:
        - userName
        - xp
        - streak
        - level
        - coins
        - studyTimeToday
        - studyTimeWeek
        - notesCount
        - flashcardDecksCount
        - quizzesCompletedCount
        - documentsCount
        - recentQuizSessions
        - activeStudyPlans
        - todayTasks
        - weeklyXp

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        photoUrl:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        educationLevel:
          type: ["string", "null"]
        subjects:
          type: array
          items:
            type: string
        goals:
          type: ["string", "null"]
        learningLanguage:
          type: ["string", "null"]
        xp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        coins:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - userId
        - name
        - email
        - photoUrl
        - country
        - educationLevel
        - subjects
        - goals
        - learningLanguage
        - xp
        - streak
        - level
        - coins
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
        photoUrl:
          type: string
        country:
          type: string
        educationLevel:
          type: string
        subjects:
          type: array
          items:
            type: string
        goals:
          type: string
        learningLanguage:
          type: string

    Note:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        content:
          type: string
        subject:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - content
        - subject
        - tags
        - createdAt
        - updatedAt

    NoteInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        subject:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - content

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        subject:
          type: string
        tags:
          type: array
          items:
            type: string

    FlashcardDeck:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        subject:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        cardCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - subject
        - description
        - cardCount
        - createdAt
        - updatedAt

    FlashcardDeckWithCards:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        subject:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        cardCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"
      required:
        - id
        - userId
        - title
        - subject
        - description
        - cardCount
        - createdAt
        - updatedAt
        - cards

    FlashcardDeckInput:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
        description:
          type: string
      required:
        - title

    FlashcardDeckUpdate:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
        description:
          type: string

    Flashcard:
      type: object
      properties:
        id:
          type: integer
        deckId:
          type: integer
        front:
          type: string
        back:
          type: string
        difficulty:
          type: ["string", "null"]
        isBookmarked:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - deckId
        - front
        - back
        - difficulty
        - isBookmarked
        - createdAt

    FlashcardInput:
      type: object
      properties:
        front:
          type: string
        back:
          type: string
        difficulty:
          type: string
      required:
        - front
        - back

    FlashcardUpdate:
      type: object
      properties:
        front:
          type: string
        back:
          type: string
        difficulty:
          type: string
        isBookmarked:
          type: boolean

    QuizSession:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        subject:
          type: string
        examType:
          type: ["string", "null"]
        totalQuestions:
          type: integer
        correctAnswers:
          type: ["integer", "null"]
        score:
          type: ["number", "null"]
        source:
          type: string
          enum: [manual, photo]
        status:
          type: string
          enum: [pending, completed]
        imageUrl:
          type: ["string", "null"]
          description: |
            The photographed page (data URL) for source = "photo" sessions.
            Persisted so the student can review the original material
            alongside the AI-generated questions. null for manual quizzes
            and for photo quizzes whose image was larger than the 1.5 MB
            persistence ceiling.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - userId
        - subject
        - examType
        - totalQuestions
        - correctAnswers
        - score
        - status
        - createdAt
        - completedAt

    QuizSessionWithQuestions:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        subject:
          type: string
        examType:
          type: ["string", "null"]
        totalQuestions:
          type: integer
        correctAnswers:
          type: ["integer", "null"]
        score:
          type: ["number", "null"]
        source:
          type: string
          enum: [manual, photo]
        status:
          type: string
          enum: [pending, completed]
        imageUrl:
          type: ["string", "null"]
          description: The photographed page (data URL) for source = "photo" sessions, otherwise null.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
      required:
        - id
        - userId
        - subject
        - examType
        - totalQuestions
        - correctAnswers
        - score
        - status
        - createdAt
        - completedAt
        - questions

    QuizQuestion:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, short_answer]
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string
        userAnswer:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
        isCorrect:
          type: ["boolean", "null"]
      required:
        - id
        - sessionId
        - question
        - type
        - options
        - correctAnswer
        - userAnswer
        - explanation
        - isCorrect

    QuizSessionInput:
      type: object
      properties:
        subject:
          type: string
        examType:
          type: string
        totalQuestions:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required:
        - subject
        - totalQuestions

    PhotoQuizInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: The photo as a base64 data URL (data:image/jpeg;base64,...)
        totalQuestions:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required:
        - imageBase64

    QuizSubmission:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: integer
              answer:
                type: string
            required:
              - questionId
              - answer
      required:
        - answers

    QuizResult:
      type: object
      properties:
        sessionId:
          type: integer
        score:
          type: number
        correctAnswers:
          type: integer
        totalQuestions:
          type: integer
        xpEarned:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
      required:
        - sessionId
        - score
        - correctAnswers
        - totalQuestions
        - xpEarned
        - questions

