openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LearnMate AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: profile
    description: User profile
  - name: notes
    description: Notes management
  - name: flashcards
    description: Flashcard decks and cards
  - name: quizzes
    description: Quiz sessions
  - name: study-plans
    description: Study plans and tasks
  - name: documents
    description: PDF and document uploads
  - name: progress
    description: Progress and stats
  - name: exam-types
    description: Supported exam types
  - name: openai
    description: OpenAI AI chat and voice operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes
      parameters:
        - name: subject
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /flashcard-decks:
    get:
      operationId: listFlashcardDecks
      tags: [flashcards]
      summary: List all flashcard decks
      responses:
        "200":
          description: List of flashcard decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardDeck"
    post:
      operationId: createFlashcardDeck
      tags: [flashcards]
      summary: Create a new flashcard deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckInput"
      responses:
        "201":
          description: Created flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"

  /flashcard-decks/{id}:
    get:
      operationId: getFlashcardDeck
      tags: [flashcards]
      summary: Get a flashcard deck by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flashcard deck with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckWithCards"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateFlashcardDeck
      tags: [flashcards]
      summary: Update a flashcard deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckUpdate"
      responses:
        "200":
          description: Updated flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteFlashcardDeck
      tags: [flashcards]
      summary: Delete a flashcard deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /flashcard-decks/{id}/cards:
    get:
      operationId: listFlashcardDeckCards
      tags: [flashcards]
      summary: List all cards in a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of flashcards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flashcard"
    post:
      operationId: createFlashcardDeckCard
      tags: [flashcards]
      summary: Add a card to a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardInput"
      responses:
        "201":
          description: Created flashcard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /flashcard-decks/{id}/cards/{cardId}:
    patch:
      operationId: updateFlashcardDeckCard
      tags: [flashcards]
      summary: Update a flashcard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardUpdate"
      responses:
        "200":
          description: Updated flashcard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteFlashcardDeckCard
      tags: [flashcards]
      summary: Delete a flashcard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /quiz-sessions:
    get:
      operationId: listQuizSessions
      tags: [quizzes]
      summary: List all quiz sessions
      responses:
        "200":
          description: List of quiz sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSession"
    post:
      operationId: createQuizSession
      tags: [quizzes]
      summary: Create a new quiz session (AI generates questions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSessionInput"
      responses:
        "201":
          description: Created quiz session with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionWithQuestions"

  /quiz-sessions/from-photo:
    post:
      operationId: createQuizFromPhoto
      tags: [quizzes]
      summary: "Premium: create a quiz from a photo of study material (AI reads the image)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoQuizInput"
      responses:
        "201":
          description: Created quiz session with AI-generated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionWithQuestions"
        "403":
          description: Premium required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /quiz-sessions/{id}:
    get:
      operationId: getQuizSession
      tags: [quizzes]
      summary: Get quiz session with questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz session with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionWithQuestions"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /quiz-sessions/{id}/submit:
    post:
      operationId: submitQuizSession
      tags: [quizzes]
      summary: Submit quiz answers and get results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Quiz results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study-plans:
    get:
      operationId: listStudyPlans
      tags: [study-plans]
      summary: List all study plans
      responses:
        "200":
          description: List of study plans with their tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyPlanWithTasks"
    post:
      operationId: createStudyPlan
      tags: [study-plans]
      summary: Create a study plan (AI generates tasks)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanInput"
      responses:
        "201":
          description: Created study plan with tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanWithTasks"

  /study-plans/{id}:
    get:
      operationId: getStudyPlan
      tags: [study-plans]
      summary: Get study plan with tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study plan with tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanWithTasks"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateStudyPlan
      tags: [study-plans]
      summary: Update a study plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanUpdate"
      responses:
        "200":
          description: Updated study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteStudyPlan
      tags: [study-plans]
      summary: Delete a study plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study-plans/{id}/tasks/{taskId}:
    patch:
      operationId: updateStudyTask
      tags: [study-plans]
      summary: Update a study task (e.g. mark complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTask"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all uploaded documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload a document (base64 encoded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document with AI-generated details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document with details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /documents/{id}/process:
    post:
      operationId: processDocument
      tags: [documents]
      summary: Process a document with AI (generates summary, flashcards, quiz)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /progress/stats:
    get:
      operationId: getProgressStats
      tags: [progress]
      summary: Get detailed learning progress and stats
      responses:
        "200":
          description: Progress stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressStats"

  /exam-types:
    get:
      operationId: listExamTypes
      tags: [exam-types]
      summary: List supported exam types
      responses:
        "200":
          description: List of exam types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamType"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all AI tutor conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new AI tutor conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /premium/available-plans:
    get:
      operationId: getAvailablePlans
      tags: [premium]
      summary: List payment tiers currently configured on the server
      description: |
        Returns which plans the frontend should show. When `yearly.available` is
        false, the yearly tier card should be hidden — the yearly checkout
        endpoint will return 503 if called anyway.
      responses:
        "200":
          description: Available plan tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailablePlans"

  /premium/subscription:
    get:
      operationId: getSubscription
      tags: [premium]
      summary: Get the current user's subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"

  /premium/payments:
    get:
      operationId: listMyPayments
      tags: [premium]
      summary: List the current user's payment submissions
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /premium/whop/checkout:
    post:
      operationId: createWhopCheckout
      tags: [premium]
      summary: Create a Whop hosted card checkout and return the payment URL
      responses:
        "200":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhopCheckoutResult"

  /premium/whop/verify:
    post:
      operationId: verifyWhopCheckout
      tags: [premium]
      summary: Verify the user's Whop card payment and activate premium
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhopVerifyResult"

  /premium/smart-notes:
    post:
      operationId: generateSmartNotes
      tags: [premium]
      summary: Generate, summarize, or solve study notes with AI (premium)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartNotesInput"
      responses:
        "200":
          description: Generated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartNotesResult"
        "403":
          description: Premium required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /premium/important-questions:
    post:
      operationId: generateImportantQuestions
      tags: [premium]
      summary: Generate likely exam questions with answers (premium)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportantQuestionsInput"
      responses:
        "200":
          description: Important questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportantQuestionsResult"
        "403":
          description: Premium required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /language/overview:
    get:
      operationId: getLanguageOverview
      tags: [language]
      summary: Daily language practice overview (time, plan, progress, words)
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [English, Spanish, French, Portuguese, German, Arabic, Hindi, Japanese]
      responses:
        "200":
          description: Language practice overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageOverview"

  /language/tick:
    post:
      operationId: languageTick
      tags: [language]
      summary: Heartbeat that credits active practice time (server-side clock)
      responses:
        "200":
          description: Updated usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageTickResult"

  /language/exercises:
    post:
      operationId: generateLanguageExercises
      tags: [language]
      summary: Generate a batch of AI language exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageExercisesInput"
      responses:
        "200":
          description: Generated exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageExercisesResult"
        "403":
          description: Daily practice time used up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /language/grade-sentence:
    post:
      operationId: gradeLanguageSentence
      tags: [language]
      summary: Grade a student's sentence correction with AI feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
